[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-valid"
version = "0.1.0"
description = "Calibrated source attribution under unequal and correlated variant spaces"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
graph-valid = "graph_valid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
